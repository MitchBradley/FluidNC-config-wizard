module:
  id: 4x_powered_input
  name: "4x Powered Input Module"
  manufacturer: "Dring Engineering Services"
  form_factor: cnc_io_module_12pin
  status: active

meta:
  wiki_url: "http://wiki.fluidnc.com/en/hardware/cnc_io_modules#basic-input"
  source_files_url: "https://oshwlab.com/bdring/4x-basic-input-module_copy"
  notes: >
    4 RC-filtered digital inputs, one per module pin (1-4), with 5V power

generic_pins:
  - label: "Input 1"
    generic_name: "In1"
    module_pin: "1"
    direction: input
    input_profile: { conditioning: rc_filtered }
  - label: "Input 2"
    generic_name: "In2"
    module_pin: "2"
    direction: input
    input_profile: { conditioning: rc_filtered }
  - label: "Input 3"
    generic_name: "In3"
    module_pin: "3"
    direction: input
    input_profile: { conditioning: rc_filtered }
  - label: "Input 4"
    generic_name: "In4"
    module_pin: "4"
    direction: input
    input_profile: { conditioning: rc_filtered }
