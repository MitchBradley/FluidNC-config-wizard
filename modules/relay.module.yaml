module:
  id: relay
  name: "Relay Module"
  manufacturer: "Dring Engineering Services"
  form_factor: cnc_io_module_12pin
  status: active

meta:
  wiki_url: "http://wiki.fluidnc.com/en/hardware/cnc_io_modules#relay-module"
  purchase_url: "https://www.tindie.com/products/21491/"
  source_files_url: "https://oshwlab.com/bdring/6-pack-quad-mosfet-module"
