module:
  id: passthrough
  name: "Passthrough (no module / unmodeled accessory)"
  status: active

meta:
  notes: >
    Not a real, physical product -- has no photo/hotspot file, unlike every
    other entry in modules/. This is the module socket's own default/"what
    if nothing (recognized) is plugged in" choice: it exposes every one of
    the socket's own pins individually and directly, exactly as though they
    were ordinary board-level generic_pins with direction: either, with no
    fixed grouping or config.yaml shape imposed across them. This is also
    the correct choice for a real module this catalog simply doesn't have
    an entry for yet (e.g. a Basic Input, Prototype, or one-off community
    board), and it's how every "CNC I/O Module Socket"-style connector on
    an existing board.yaml was modeled before module sockets were their own
    concept -- see this file's own generic_pins entry below.

    Unlike every other module file, this one's single generic_pins entry
    uses the "*" wildcard module_pin (see module.schema.json's
    module_pin_ref) instead of a real socket-position number: it is a
    TEMPLATE, not a literal connector, and the wizard must instantiate one
    independent connector per pin actually present on whichever socket this
    module is plugged into (in socket-pin order, "1".."N"), regardless of
    whether that socket has 1, 2, 4, or 8 pins -- never a fixed count of
    its own. Each instantiated pin keeps this template's direction/profiles
    unchanged.

generic_pins:
  - label: "Pin"
    generic_name: "Pin"
    module_pin: "*"
    direction: either
    input_profile: { conditioning: raw }
    output_profile: { drive_type: totem_pole }
    notes: "Template connector -- see this file's own meta.notes. Repeats once per pin the plugged-in socket actually has."
