board:
  id: greyhound
  name: "Greyhound CNC Controller"
  manufacturer: "Dring Engineering Services"
  mcu_chip: esp32s3
  revision: "V1.0"
  status: active

meta:
  wiki_url: "http://wiki.fluidnc.com/en/hardware/official/greyhound"
  notes: >
    6-motor-connector controller for EXTERNAL stepper driver modules (no
    onboard drivers) -- wiki: "very similar to the Corgi controller, except
    it uses an ESP32-S3 CPU which has more I/O and a native USB connector."
    12V main supply (reverse-polarity protected, unlike some other Dring
    boards), primary USB-C (CP2102) for programming/serial, secondary
    native USB-C ("USB CDC", experimental, direct to the ESP32-S3's fixed
    USB_D-/USB_D+ silicon pins -- see chips/esp32s3.chip.yaml

stepping:
  engines: [i2s]

fixed_peripherals:
  spi:
    miso_pin: gpio.2
    mosi_pin: gpio.1
    sck_pin: gpio.21
  sdcard:
    cs_pin: gpio.9
    card_detect_pin: NO_PIN
  i2so:
    bck_pin: gpio.16
    data_pin: gpio.17
    ws_pin: gpio.18
    pin_count: 32
    oe_pin: NO_PIN

motor_sockets:
  shared_disable_pin: NO_PIN
  shared_reset_pin: NO_PIN
  sockets:
    - label: "Motor Drivers - 1"
      generic_name: "Driver1"
      driver_class: external_connector
      pins: { step_pin: i2so.1, direction_pin: i2so.2, disable_pin: i2so.0 }
    - label: "Motor Drivers - 2"
      generic_name: "Driver2"
      driver_class: external_connector
      pins: { step_pin: i2so.4, direction_pin: i2so.5, disable_pin: i2so.3 }
    - label: "Motor Drivers - 3"
      generic_name: "Driver3"
      driver_class: external_connector
      pins: { step_pin: i2so.7, direction_pin: i2so.8, disable_pin: i2so.6 }
    - label: "Motor Drivers - 4"
      generic_name: "Driver4"
      driver_class: external_connector
      pins: { step_pin: i2so.17, direction_pin: i2so.18, disable_pin: i2so.16 }
    - label: "Motor Drivers - 5"
      generic_name: "Driver5"
      driver_class: external_connector
      pins: { step_pin: i2so.20, direction_pin: i2so.21, disable_pin: i2so.19 }
    - label: "Motor Drivers - 6"
      generic_name: "Driver6"
      driver_class: external_connector
      pins: { step_pin: i2so.23, direction_pin: i2so.24, disable_pin: i2so.22 }

generic_pins:
  - { label: "Inputs - GPIO.42", generic_name: "In42", mcu_pin: gpio.42, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.41", generic_name: "In41", mcu_pin: gpio.41, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.40", generic_name: "In40", mcu_pin: gpio.40, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.39", generic_name: "In39", mcu_pin: gpio.39, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.38", generic_name: "In38", mcu_pin: gpio.38, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.37", generic_name: "In37", mcu_pin: gpio.37, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.36", generic_name: "In36", mcu_pin: gpio.36, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.48", generic_name: "In48", mcu_pin: gpio.48, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.47", generic_name: "In47", mcu_pin: gpio.47, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.3", generic_name: "In3", mcu_pin: gpio.3, direction: input, input_profile: { conditioning: opto_isolated } }

  # 5V outputs.  Out4 and Out5 are shared with FET1 and FET2
  - { label: "5V Outputs - GPIO.4", generic_name: "5V Out4", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0, current_max_a: 0.020 }, notes: "Also activates MOSFET1 (gpio.4) simultaneously -- see generic_pins entry FET4." }
  - { label: "5V Outputs - GPIO.5", generic_name: "5V Out5", mcu_pin: gpio.5, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0, current_max_a: 0.020 }, notes: "Also activates MOSFET2 (gpio.5) simultaneously -- see generic_pins entry FET5." }
  - { label: "5V Outputs - GPIO.46", generic_name: "5V Out46", mcu_pin: gpio.46, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0, current_max_a: 0.020 } }
  - { label: "5V Outputs - GPIO.45", generic_name: "5V Out45", mcu_pin: gpio.45, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0, current_max_a: 0.020 } }

  # 2x MOSFETs, sharing gpio.4/gpio.5 with 5V outputs 1/2 above
  - { label: "FET1 gpio.4", generic_name: "FET1", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 12.0, current_max_a: 3.0 }, notes: "3A continuous, 5A peak per wiki. Voltage_max reflects the board's stated 12V VMot supply convention, not an independently confirmed MOSFET standoff rating. Shares gpio.4 with 5V Output 1 -- not independent." }
  - { label: "FET2 gpio.5", generic_name: "FET2", mcu_pin: gpio.5, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 12.0, current_max_a: 3.0 }, notes: "3A continuous, 5A peak per wiki. Voltage_max reflects the board's stated 12V VMot supply convention, not an independently confirmed MOSFET standoff rating. Shares gpio.5 with 5V Output 2 -- not independent." }

  # 0-10V analog spindle speed output (op-amp + low-pass filter, trim-pot
  # adjustable 5-10V max) plus its forward/reverse opto outputs.
  - { label: "0-10V - 10v gpio.6", generic_name: "Spindle 10V", mcu_pin: gpio.6, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 10.0 }, notes: "PWM + analog filter + trim pot; adjustable max 5-10V, must be measured/set before connecting to a VFD." }
  - { label: "FWD gpio.7", generic_name: "Spindle FWD", mcu_pin: gpio.7, direction: output, output_profile: { drive_type: open_collector }, notes: "Opto output to a common ground supplied by the VFD (per wiki, not the controller's own ground)." }
  - { label: "REV gpio.8", generic_name: "Spindle REV", mcu_pin: gpio.8, direction: output, output_profile: { drive_type: open_collector }, notes: "Opto output to a common ground supplied by the VFD (per wiki, not the controller's own ground)." }

  # I2S outputs not associated with motor sockets, usable for general purposes
  # The drive type is current controlled sink to ground, from a LED-driver chip
  - { label: "25 - i2so.25", generic_name: "i2so.25", mcu_pin: i2so.25, direction: output, output_profile: { drive_type: open_collector }, notes: "LED driver pin" }
  - { label: "26 - i2so.26", generic_name: "i2so.26", mcu_pin: i2so.26, direction: output, output_profile: { drive_type: open_collector }, notes: "LED driver pin" }
  - { label: "27 - i2so.27", generic_name: "i2so.27", mcu_pin: i2so.27, direction: output, output_profile: { drive_type: open_collector }, notes: "LED driver pin" }
  - { label: "28 - i2so.28", generic_name: "i2so.28", mcu_pin: i2so.28, direction: output, output_profile: { drive_type: open_collector }, notes: "LED driver pin" }
  - { label: "29 - i2so.29", generic_name: "i2so.29", mcu_pin: i2so.29, direction: output, output_profile: { drive_type: open_collector }, notes: "LED driver pin" }
  - { label: "30 - i2so.30", generic_name: "i2so.30", mcu_pin: i2so.30, direction: output, output_profile: { drive_type: open_collector }, notes: "LED driver pin" }

expansion_sockets:
  - label: "Module Socket"
    generic_name: "Module Socket"
    pins:
      - { module_pin: "1", mcu_pin: gpio.14, direction: either }
      - { module_pin: "2", mcu_pin: gpio.13, direction: either }
      - { module_pin: "3", mcu_pin: gpio.10, direction: either }
      - { module_pin: "4", mcu_pin: gpio.15, direction: either }

rs485_channels:
  - label: "RS485"
    tx_pin: gpio.12
    rx_pin: gpio.11
    pins_reusable_as_generic_io: false

expansion_uarts:
  - label: "Expansion Port"
    generic_name: "Pendant"
    connector_type: "RJ12"
    txd_pin: gpio.0
    rxd_pin: gpio.35
    baud: 1000000
    mode: "8N1"
    notes: "Standard RJ12 connector compatible with the Airedale I/O expander and most pendants. gpio.0 is also an ESP32-S3 strapping pin (boot mode select) -- see chips/esp32s3.chip.yaml."
