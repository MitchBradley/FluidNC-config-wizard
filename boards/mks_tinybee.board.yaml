board:
  id: mks_tinybee
  name: "MKS Tinybee"
  manufacturer: "Makerbase"
  mcu_chip: esp32
  status: community_documented
stepping:
  engines: [i2s]
fixed_peripherals:
  spi: { miso_pin: gpio.19, mosi_pin: gpio.23, sck_pin: gpio.18 }
  sdcard: { cs_pin: gpio.5, card_detect_pin: gpio.34 }
  i2so: { bck_pin: gpio.25, data_pin: gpio.27, ws_pin: gpio.26, pin_count: 24, oe_pin: NO_PIN }
motor_sockets:
  shared_disable_pin: NO_PIN
  shared_reset_pin: NO_PIN
  sockets:
    - label: "X"
      generic_name: "Motor1"
      driver_class: stepstick_socket
      pins: { disable_pin: i2so.0, step_pin: i2so.1, direction_pin: i2so.2 }
    - label: "Y"
      generic_name: "Motor2"
      driver_class: stepstick_socket
      pins: { disable_pin: i2so.3, step_pin: i2so.4, direction_pin: i2so.5 }
    - label: "Z"
      generic_name: "Motor3"
      driver_class: stepstick_socket
      pins: { disable_pin: i2so.6, step_pin: i2so.7, direction_pin: i2so.8 }
    - label: "E0"
      generic_name: "Motor4"
      driver_class: stepstick_socket
      pins: { disable_pin: i2so.9, step_pin: i2so.10, direction_pin: i2so.11 }
    - label: "E1"
      generic_name: "Motor5"
      driver_class: stepstick_socket
      pins: { disable_pin: i2so.12, step_pin: i2so.13, direction_pin: i2so.14 }
    - label: "XEXT"
      generic_name: "Driver1"
      driver_class: external_connector
      pins: { disable_pin: i2so.0, step_pin: i2so.1, direction_pin: i2so.2 }
    - label: "YEXT"
      generic_name: "Driver2"
      driver_class: external_connector
      pins: { disable_pin: i2so.3, step_pin: i2so.4, direction_pin: i2so.5 }
    - label: "ZEXT"
      generic_name: "Driver3"
      driver_class: external_connector
      pins: { disable_pin: i2so.6, step_pin: i2so.7, direction_pin: i2so.8 }
    - label: "E0EXT"
      generic_name: "Driver4"
      driver_class: external_connector
      pins: { disable_pin: i2so.9, step_pin: i2so.10, direction_pin: i2so.11 }
    - label: "E1EXT"
      generic_name: "Driver5"
      driver_class: external_connector
      pins: { disable_pin: i2so.12, step_pin: i2so.13, direction_pin: i2so.14 }

generic_pins:
  - { label: "Limit X-", generic_name: "In33", mcu_pin: gpio.33, direction: input, input_profile: { conditioning: rc_filtered } }
  - { label: "Limit Y-", generic_name: "In32", mcu_pin: gpio.32, direction: input, input_profile: { conditioning: rc_filtered } }
  - { label: "Limit Z-", generic_name: "In22", mcu_pin: gpio.22, direction: input, input_profile: { conditioning: rc_filtered } }

  - { label: "TH2", generic_name: "In34", mcu_pin: gpio.34, direction: input, input_profile: { conditioning: rc_filtered } }
  - { label: "TH1", generic_name: "In36", mcu_pin: gpio.36, direction: input, input_profile: { conditioning: rc_filtered } }
  - { label: "TB", generic_name: "In39", mcu_pin: gpio.39, direction: input, input_profile: { conditioning: rc_filtered } }
  - { label: "MT_DET", generic_name: "In35", mcu_pin: gpio.35, direction: input, input_profile: { conditioning: rc_filtered } }

  - { label: "H-BED", generic_name: "FET I2S16", mcu_pin: i2so.16, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 24.0, current_max_a: 100.0 }, notes: "Mosfet is G024N03 - 30V/100A." }
  - { label: "H-E0", generic_name: "FET I2S17", mcu_pin: i2so.17, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 24.0, current_max_a: 42.0 }, notes: "Mosfet is HY1403D - 30V/42A." }
  - { label: "H-E1", generic_name: "FET I2S18", mcu_pin: i2so.18, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 24.0, current_max_a: 42.0 }, notes: "Mosfet is HY1403D - 30V/42A." }

  - { label: "H-FAN1", generic_name: "5VOut I2S19", mcu_pin: i2so.19, direction: output, output_profile: { drive_type: mosfet_low_side } }
  - { label: "FAN2", generic_name: "5VOut I2S20", mcu_pin: i2so.20, direction: output, output_profile: { drive_type: mosfet_low_side } }
  - { label: "BEEPER", generic_name: "5VOut I2S21", mcu_pin: i2so.21, direction: output, output_profile: { drive_type: totem_pole } }

  - { label: "LCD_D4", generic_name: "5V Out0", mcu_pin: gpio.0, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "3DTOUCH", generic_name: "5V Out2", mcu_pin: gpio.2, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "LCD_RS", generic_name: "5V Out4", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "LCD_D6", generic_name: "5V Out15", mcu_pin: gpio.15, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "LCD_EN", generic_name: "5V Out21", mcu_pin: gpio.21, direction: output, output_profile: { drive_type: totem_pole } }

  - { label: "LCD_D5", generic_name: "IO16", mcu_pin: gpio.16, direction: either, input_profile: { conditioning: raw }, output_profile: { drive_type: totem_pole } }
  - { label: "LCD_D7", generic_name: "IO17", mcu_pin: gpio.17, direction: either, input_profile: { conditioning: raw }, output_profile: { drive_type: totem_pole } }
