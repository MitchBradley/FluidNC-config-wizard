board:
  id: doberman
  name: "Doberman CNC Controller"
  manufacturer: "Dring Engineering Services"
  mcu_chip: esp32s3
  revision: "V1.0"
  status: active

meta:
  wiki_url: "http://wiki.fluidnc.com/en/hardware/official/doberman"
  purchase_url: "https://www.elecrow.com/doberman-esp32-s3-8-axis-cnc-controller.html"
  schematic_url: "https://oshwlab.com/bdring/doberman"
  notes: >
    8-motor-connector controller for EXTERNAL stepper driver modules (no
    onboard drivers) -- wiki: "very similar to the Corgi controller, except
    it uses an ESP32-S3 CPU which has more I/O and a native USB connector."
    12V main supply (reverse-polarity protected, unlike some other Dring
    boards), primary USB-C (CP2102) for programming/serial, secondary
    native USB-C ("USB CDC", experimental, direct to the ESP32-S3's fixed
    USB_D-/USB_D+ silicon pins -- see chips/esp32s3.chip.yaml

    The I/O module pins are listed as individual IO pins since we do
    not have module abstraction at this time.

stepping:
  engines: [i2s]

fixed_peripherals:
  spi:
    miso_pin: gpio.2
    mosi_pin: gpio.1
    sck_pin: gpio.21
  sdcard:
    cs_pin: gpio.9
    card_detect_pin: NO_PIN
  i2so:
    bck_pin: gpio.16
    data_pin: gpio.17
    ws_pin: gpio.18
    pin_count: 24
    oe_pin: NO_PIN

motor_sockets:
  shared_disable_pin: NO_PIN
  shared_reset_pin: NO_PIN
  # I2SO shift-register logic outputs to the driver connector.
  output_profile: { drive_type: totem_pole }
  sockets:
    - label: "Motor Drivers - X"
      generic_name: "Driver1"
      driver_class: external_connector
      pins: { step_pin: i2so.0, direction_pin: i2so.1, disable_pin: i2so.2 }
    - label: "Motor Drivers - Y"
      generic_name: "Driver2"
      driver_class: external_connector
      pins: { step_pin: i2so.3, direction_pin: i2so.4, disable_pin: i2so.5 }
    - label: "Motor Drivers - Z"
      generic_name: "Driver3"
      driver_class: external_connector
      pins: { step_pin: i2so.6, direction_pin: i2so.7, disable_pin: i2so.8 }
    - label: "Motor Drivers - A"
      generic_name: "Driver4"
      driver_class: external_connector
      pins: { step_pin: i2so.9, direction_pin: i2so.10, disable_pin: i2so.11 }
    - label: "Motor Drivers - B"
      generic_name: "Driver5"
      driver_class: external_connector
      pins: { step_pin: i2so.12, direction_pin: i2so.13, disable_pin: i2so.14 }
    - label: "Motor Drivers - C"
      generic_name: "Driver6"
      driver_class: external_connector
      pins: { step_pin: i2so.15, direction_pin: i2so.16, disable_pin: i2so.17 }
    - label: "Motor Drivers - U"
      generic_name: "Driver7"
      driver_class: external_connector
      pins: { step_pin: i2so.18, direction_pin: i2so.19, disable_pin: i2so.20 }
    - label: "Motor Drivers - V"
      generic_name: "Driver8"
      driver_class: external_connector
      pins: { step_pin: i2so.21, direction_pin: i2so.22, disable_pin: i2so.23 }

generic_pins:
  # 8 limit-switch inputs, one per motor connector (see each socket's own
  # notes above for which). 3-pin JST connectors (Switch Vcc/Gnd/
  # signal), jumper-selectable Switch Vcc voltage (shared across all 8),
  # opto-isolated with a reverse-voltage protection diode, and "All of the
  # inputs have external pullup resistors. You do not need the :pu
  # attribute" -- though the wiki's own example config uses :pu anyway
  # (redundant but harmless).
  - { label: "Inputs - GPIO.42", generic_name: "In42", mcu_pin: gpio.42, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.41", generic_name: "In41", mcu_pin: gpio.41, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.40", generic_name: "In40", mcu_pin: gpio.40, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.39", generic_name: "In39", mcu_pin: gpio.39, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.38", generic_name: "In38", mcu_pin: gpio.38, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.37", generic_name: "In37", mcu_pin: gpio.37, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.36", generic_name: "In36", mcu_pin: gpio.36, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.48", generic_name: "In48", mcu_pin: gpio.48, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.47", generic_name: "In47", mcu_pin: gpio.47, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "Inputs - GPIO.3", generic_name: "In3", mcu_pin: gpio.3, direction: input, input_profile: { conditioning: opto_isolated } }

  # 4x 5V outputs, 74AHCT125-buffered, "left to right" order per wiki.
  # gpio.4/gpio.5 also each drive a MOSFET simultaneously (see below) --
  - { label: "5V Outputs - GPIO.4", generic_name: "5V Out4", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0, current_max_a: 0.020 }, notes: "Also activates MOSFET1 (gpio.4) simultaneously -- see generic_pins entry FET4." }
  - { label: "5V Outputs - GPIO.2", generic_name: "5V Out5", mcu_pin: gpio.5, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0, current_max_a: 0.020 }, notes: "Also activates MOSFET2 (gpio.5) simultaneously -- see generic_pins entry FET5." }
  - { label: "5V Outputs - GPIO.46", generic_name: "5V Out46", mcu_pin: gpio.46, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0, current_max_a: 0.020 } }
  - { label: "5V Outputs - GPIO.45", generic_name: "5V Out45", mcu_pin: gpio.45, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0, current_max_a: 0.020 } }

  # 2x MOSFETs, sharing gpio.4/gpio.5 with 5V outputs 1/2 above (genuine
  # dual-purpose, not independent circuits -- see their notes).
  - { label: "FET1 gpio.4", generic_name: "FET4", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 12.0, current_max_a: 3.0, common: vmot }, notes: "3A continuous, 5A peak per wiki. Voltage_max reflects the board's stated 12V VMot supply convention, not an independently confirmed MOSFET standoff rating. Shares gpio.4 with 5V Output 1 -- not independent." }
  - { label: "FET2 gpio.5", generic_name: "FET5", mcu_pin: gpio.5, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 12.0, current_max_a: 3.0, common: vmot }, notes: "3A continuous, 5A peak per wiki. Voltage_max reflects the board's stated 12V VMot supply convention, not an independently confirmed MOSFET standoff rating. Shares gpio.5 with 5V Output 2 -- not independent." }

  # 0-10V analog spindle speed output (op-amp + low-pass filter, trim-pot
  # adjustable 5-10V max) plus its forward/reverse opto outputs.
  - { label: "0-10V - 10v gpio.6", generic_name: "Spindle 10V", mcu_pin: gpio.6, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 10.0 }, notes: "PWM + analog filter + trim pot; adjustable max 5-10V, must be measured/set before connecting to a VFD." }
  - { label: "0-10V - 1 gpio.7", generic_name: "Spindle Out7", mcu_pin: gpio.7, direction: output, output_profile: { drive_type: open_collector, common: vfd_common }, notes: "Opto output to a common ground supplied by the VFD (per wiki, not the controller's own ground)." }
  - { label: "0-10V - 2 gpio.8", generic_name: "Spindle Out8", mcu_pin: gpio.8, direction: output, output_profile: { drive_type: open_collector, common: vfd_common }, notes: "Opto output to a common ground supplied by the VFD (per wiki, not the controller's own ground)." }

expansion_sockets:
  - label: "Module Socket"
    generic_name: "Module Socket"
    pins:
      - { module_pin: "1", mcu_pin: gpio.14, direction: either }
      - { module_pin: "2", mcu_pin: gpio.13, direction: either }
      - { module_pin: "3", mcu_pin: gpio.10, direction: either }
      - { module_pin: "4", mcu_pin: gpio.15, direction: either }

rs485_channels:
  - label: "RS485"
    tx_pin: gpio.12
    rx_pin: gpio.11
    pins_reusable_as_generic_io: false

expansion_uarts:
  - label: "Expansion Port"
    generic_name: "Pendant"
    connector_type: "RJ12"
    txd_pin: gpio.0
    rxd_pin: gpio.35
    baud: 1000000
    mode: "8N1"
    notes: "Wiki: \"standard RJ12 connector compatible with the Airedale I/O expander and most pendants.\" gpio.0 is also an ESP32-S3 strapping pin (boot mode select) -- see chips/esp32s3.chip.yaml."
