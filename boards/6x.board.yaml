board:
  id: 6x
  name: "6x CNC Controller"
  manufacturer: "Dring Engineering Services"
  mcu_chip: esp32
  status: active
stepping:
  engines: [i2s]
fixed_peripherals:
  spi: { miso_pin: gpio.19, mosi_pin: gpio.23, sck_pin: gpio.18 }
  sdcard: { cs_pin: gpio.5 }
  i2so: { bck_pin: gpio.22, data_pin: gpio.21, ws_pin: gpio.17, pin_count: 24 }
motor_sockets:
  sockets:
    - label: "Motor1"
      generic_name: Driver1
      driver_class: external_connector
      pins: { step_pin: i2so.2, direction_pin: i2so.1, disable_pin: i2so.0 }
    - label: "Motor2"
      generic_name: Driver2
      driver_class: external_connector
      pins: { step_pin: i2so.5, direction_pin: i2so.4, disable_pin: i2so.7 }
    - label: "Motor3"
      generic_name: Driver3
      driver_class: external_connector
      pins: { step_pin: i2so.10, direction_pin: i2so.9, disable_pin: i2so.8 }
    - label: "Motor4"
      generic_name: Driver4
      driver_class: external_connector
      pins: { step_pin: i2so.13, direction_pin: i2so.12, disable_pin: i2so.15 }
    - label: "Motor5"
      generic_name: Driver5
      driver_class: external_connector
      pins: { step_pin: i2so.18, direction_pin: i2so.17, disable_pin: i2so.16 }
    - label: "Motor6"
      generic_name: Driver6
      driver_class: external_connector
      pins: { step_pin: i2so.21, direction_pin: i2so.20, disable_pin: i2so.23 }
generic_pins:
  - { label: "IO2",  generic_name: "In2", mcu_pin: gpio.2,  direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "IO26", generic_name: "In26", mcu_pin: gpio.26, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "IO33", generic_name: "In33", mcu_pin: gpio.33, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "IO32", generic_name: "In32", mcu_pin: gpio.32, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "IO35", generic_name: "In35", mcu_pin: gpio.35, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "IO34", generic_name: "In34", mcu_pin: gpio.34, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "IO39", generic_name: "In39", mcu_pin: gpio.39, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "IO36", generic_name: "In36", mcu_pin: gpio.36, direction: input, input_profile: { conditioning: opto_isolated } }
  - { label: "5V Out (shared w/ MOSFET2)", generic_name: "5V Out12", mcu_pin: gpio.12, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "5V Out (shared w/ MOSFET1)", generic_name: "5V Out4", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "5V Out 3", generic_name: "5V Out13", mcu_pin: gpio.13, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "5V Out 4", generic_name: "5V Out14", mcu_pin: gpio.14, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "MOSFET1", generic_name: "FET4", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: mosfet_low_side } }  
  - { label: "MOSFET2", generic_name: "FET12", mcu_pin: gpio.12, direction: output, output_profile: { drive_type: mosfet_low_side } }
  - { label: "Spindle Fwd", generic_name: "Spindle Out15", mcu_pin: gpio.15, direction: output, output_profile: { drive_type: open_collector } }
  - { label: "Spindle Rev", generic_name: "Spindle Out14", mcu_pin: gpio.14, direction: output, output_profile: { drive_type: open_collector } }
  - { label: "0-10V - 10v gpio.13", generic_name: "Spindle 10V", mcu_pin: gpio.6, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 10.0 }, notes: "PWM + analog filter + trim pot; adjustable max 5-10V, must be measured/set before connecting to a VFD." }
    # Indivual pins on the module socket
  - { label: "CNC I/O Module Socket - GPIO.25", generic_name: "IO25", mcu_pin: gpio.25, direction: either, input_profile: { conditioning: raw }, output_profile: { drive_type: totem_pole } }
  - { label: "CNC I/O Module Socket - GPIO.27", generic_name: "IO27", mcu_pin: gpio.27, direction: either, input_profile: { conditioning: raw }, output_profile: { drive_type: totem_pole } }

rs485_channels:
  - { label: "RS485", tx_pin: gpio.15, rx_pin: gpio.16, rts_pin: gpio.14, pins_reusable_as_generic_io: true }

expansion_uarts:
  - label: "Expander"
    generic_name: "Expander Module"
    connector_type: "RJ12 Expander"
    txd_pin: gpio.27
    rxd_pin: gpio.25
    baud: 1000000
    mode: "8N1"
    notes: >
      Wiki: "Built in RJ12 for pendants and expanders" (FluidDial, Airedale).
      First board in this schema with a dedicated expansion UART connector
      distinct from the generic bidirectional-pin expansion_sockets used by
      6x/4x -- this connector's pins are fixed and always meant to be
      written into config.yaml as a uartN:/uart_channelN: pair (per the
      wiki's own example config), never consumed silently like a TMC UART
      bus. No rts_pin/cts_pin -- confirmed via the wiki's own example, which
      writes both as literal NO_PIN. This board has no onboard UART-
      addressed TMC drivers, so the wizard's default uart_num for this
      connector is 1 (see rs485_channels.notes for the resulting real,
      accepted conflict on boards that DO have such drivers, e.g. the 4x
      controller).
