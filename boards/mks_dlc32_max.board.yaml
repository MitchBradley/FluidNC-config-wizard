board:
  id: mks_dlc32_max
  name: "MKS DLC32 Max"
  manufacturer: "Makerbase"
  mcu_chip: esp32s3
  status: community_documented

meta:
  wiki_url: "http://wiki.fluidnc.com/en/hardware/3rd-party/MKS-DCL32-MAX"
  vendor_docs_url: "https://github.com/makerbase-mks/MKS-DLC32/tree/main/MKS--DLC32-MAX-main"
  notes: >
    The DLC32 Max is in the same family as MKS DLC32, but it has an ESP32-S3
    MCU instead of a plain ESP32.  The stepper pins are driven directly
    from GPIOs instead of using I2S expansion, since the S3 chip has enough
    GPIOs for that.  There is no published schematic, so a lot of the
    circuitry had to be inferred by guesswork.

stepping:
  engines: [timed]
  notes: >
    Engine must be timed because the board the ESP32-S3 port does not have RMT.

fixed_peripherals:
  spi:
    miso_pin: gpio.12
    mosi_pin: gpio.14
    sck_pin: gpio.13
    notes: "Per wiki's SD Card section and example config."
  sdcard:
    cs_pin: gpio.21
    card_detect_pin: gpio.10

motor_sockets:
  shared_disable_pin: gpio.8
  shared_reset_pin: NO_PIN
  notes: >
    Wiki: "Use The motors use a shared disable pin (gpio.8). Use motor type
    'stepstick:' or 'standard_stepper:'" -- plain-GPIO stepstick sockets,
    not I2SO-driven, unlike most other boards in this schema. Labeled X/Y/Z/A
    to match the wiki's own example config's axis assignment (not a stated
    silkscreen fact, since the wiki doesn't describe silkscreen labeling for
    this board, but the example config is the best available source for
    which connector maps to which axis).
  sockets:
    - label: "X-Motor"
      generic_name: "Motor1"
      driver_class: stepstick_socket
      pins: { step_pin: gpio.16, direction_pin: gpio.15 }
    - label: "Y-Motor"
      generic_name: "Motor2"
      driver_class: stepstick_socket
      pins: { step_pin: gpio.7, direction_pin: gpio.6 }
    - label: "Z-Motor"
      generic_name: "Motor3"
      driver_class: stepstick_socket
      pins: { step_pin: gpio.5, direction_pin: gpio.4 }
    - label: "A-Motor"
      generic_name: "Motor4"
      driver_class: stepstick_socket
      pins: { step_pin: gpio.20, direction_pin: gpio.19 }

generic_pins:
  # Limit inputs, one per axis, per the wiki's own example config
  # (axes.<letter>.motor0.limit_*_pin, all written with a ":low" active-low
  # attribute). RC-filtered per direct confirmation (not stated in the
  # wiki's own prose).
  - { label: "X-", generic_name: "In39", mcu_pin: gpio.39, direction: input, input_profile: { conditioning: rc_filtered } }
  - { label: "Y-", generic_name: "In40", mcu_pin: gpio.40, direction: input, input_profile: { conditioning: rc_filtered } }
  - { label: "Z-", generic_name: "In41", mcu_pin: gpio.41, direction: input, input_profile: { conditioning: rc_filtered } }
  - { label: "A-", generic_name: "In48", mcu_pin: gpio.48, direction: input, input_profile: { conditioning: rc_filtered } }

  - { label: "Door", generic_name: "In38", mcu_pin: gpio.38, direction: input, input_profile: { conditioning: rc_filtered } }

  - { label: "Flame", generic_name: "In36", mcu_pin: gpio.36, direction: input, input_profile: { conditioning: rc_filtered }, notes: "This board's MCU does not have PSRAM so gpio.37 is usable." }

  - { label: "Probe", generic_name: "In37", mcu_pin: gpio.37, direction: input, input_profile: { conditioning: rc_filtered }, notes: "This board's MCU does not have PSRAM so gpio.37 is usable." }

  - { label: "AIR", generic_name: "5V Out1", mcu_pin: gpio.1, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "BEEPER", generic_name: "5V Out42", mcu_pin: gpio.42, direction: output, output_profile: { drive_type: totem_pole } }

  - { label: "Laser", generic_name: "5V Out2", mcu_pin: gpio.2, direction: output, output_profile: { drive_type: totem_pole } }
  - { label: "Spindle", generic_name: "5V Out35", mcu_pin: gpio.35, direction: output, output_profile: { drive_type: totem_pole } }

expansion_uarts:
  - label: "RJ11 Uart Connector"
    generic_name: "Pendant"
    connector_type: "RJ11 Expander"
    txd_pin: gpio.17
    rxd_pin: gpio.18
    baud: 1000000
    mode: "8N1"
    notes: >
      This connector is not compatible with the FluidNC standard for RJ12
      pendant expansion connectors.  It has only 4 pins (RJ11) vs RJ12's 6
      pins.  It is probably possible to make an adapter cable that would
      work with a FluidNC pendant, since this connector has Rx, Tx, GND,
      and (probably) 5V.
