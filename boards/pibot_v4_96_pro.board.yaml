board:
  id: pibot_v4_96_pro
  name: "PiBot FluidNC Controller V4.96 Pro"
  manufacturer: "PiBot Electronics & Mechanics"
  mcu_chip: esp32
  family: "PiBot FluidNC CNC Controller"
  revision: "V4.96 Pro"
  status: active

meta:
  wiki_url: "https://wiki.pibot.com/doku.php?id=pibot_cnc_laser_series%3Av496_pro%3Astart"
  vendor_docs_url: "https://wiki.pibot.com/doku.php?id=pibot_cnc_laser_series%3Av496_pro%3Adocs%3Astart"
  schematic_url: "https://wiki.pibot.com/doku.php?id=pibot_cnc_laser_series%3Av496_pro%3Adocs%3Astart"
  notes: >
    Six-axis ESP32 controller compatible with onboard StepStick modules and
    external step/direction/enable drivers. The pin mapping is transcribed
    from PiBot's V4.96 Pro pin-definition overview and factory
    xyzabc-drv8825-config example. GPIO26 is hardware-jumper-selectable
    between an opto-isolated input and the onboard relay; the two paths are
    represented as separate resources sharing gpio.26 so the wizard prevents
    simultaneous assignment.

stepping:
  engines: [i2s]
  notes: >
    PiBot's factory configuration uses I2S_STREAM. The board schema groups
    I2S_STREAM and I2S_STATIC under the i2s engine capability.

fixed_peripherals:
  spi:
    miso_pin: gpio.19
    mosi_pin: gpio.23
    sck_pin: gpio.18
    notes: >
      Shared SPI bus for the SD card and optional SPI-mode TMC2130/TMC5160
      StepStick or external driver modules.
  sdcard:
    cs_pin: gpio.5
    card_detect_pin: NO_PIN
  i2so:
    bck_pin: gpio.22
    data_pin: gpio.21
    ws_pin: gpio.17
    pin_count: 24
    notes: >
      Three cascaded shift registers provide i2so.0 through i2so.23 for six
      EN/STEP/DIR groups and six MS3/CS signals.

motor_sockets:
  shared_disable_pin: NO_PIN
  shared_reset_pin: NO_PIN
  notes: >
    Each of the six positions can use an onboard StepStick module or an
    external standard driver. The external-driver routing jumpers connect
    the same I2SO EN/STEP/DIR signals to the green TBX terminal for that
    position, so each MotorN/DriverN pair is mutually exclusive. PiBot warns
    that an onboard driver must not be installed while that position's
    external-driver routing jumpers are fitted. MS1/MS2/RESET/SLEEP are
    selected by the shared hardware jumper bank; MS3 is controlled by I2SO
    and also serves as CS for supported SPI driver modules.
  sockets:
    - label: "DRV1 / X"
      generic_name: "Motor1"
      driver_class: stepstick_socket
      pins: { step_pin: i2so.2, direction_pin: i2so.1, disable_pin: i2so.0, ms3_pin: i2so.3 }
      notes: "Onboard X StepStick position. Shares EN/STEP/DIR with Driver1; i2so.3 is MS3/CSX."
    - label: "DRV2 / Y"
      generic_name: "Motor2"
      driver_class: stepstick_socket
      pins: { step_pin: i2so.5, direction_pin: i2so.4, disable_pin: i2so.7, ms3_pin: i2so.6 }
      notes: "Onboard Y StepStick position. Shares EN/STEP/DIR with Driver2; i2so.6 is MS3/CSY."
    - label: "DRV3 / Z"
      generic_name: "Motor3"
      driver_class: stepstick_socket
      pins: { step_pin: i2so.10, direction_pin: i2so.9, disable_pin: i2so.8, ms3_pin: i2so.11 }
      notes: "Onboard Z StepStick position. Shares EN/STEP/DIR with Driver3; i2so.11 is MS3/CSZ."
    - label: "DRV4 / A"
      generic_name: "Motor4"
      driver_class: stepstick_socket
      pins: { step_pin: i2so.13, direction_pin: i2so.12, disable_pin: i2so.15, ms3_pin: i2so.14 }
      notes: "Onboard A StepStick position. Shares EN/STEP/DIR with Driver4; i2so.14 is MS3/CSA."
    - label: "DRV5 / B"
      generic_name: "Motor5"
      driver_class: stepstick_socket
      pins: { step_pin: i2so.18, direction_pin: i2so.17, disable_pin: i2so.16, ms3_pin: i2so.19 }
      notes: "Onboard B StepStick position. Shares EN/STEP/DIR with Driver5; i2so.19 is MS3/CSB."
    - label: "DRV6 / C"
      generic_name: "Motor6"
      driver_class: stepstick_socket
      pins: { step_pin: i2so.21, direction_pin: i2so.20, disable_pin: i2so.23, ms3_pin: i2so.22 }
      notes: "Onboard C StepStick position. Shares EN/STEP/DIR with Driver6; i2so.22 is MS3/CSC."
    - label: "External Driver X - EN/STP/DIR"
      generic_name: "Driver1"
      driver_class: external_connector
      pins: { step_pin: i2so.2, direction_pin: i2so.1, disable_pin: i2so.0 }
      notes: "External-driver mode for position 1; requires its routing jumpers and excludes Motor1."
    - label: "External Driver Y - EN/STP/DIR"
      generic_name: "Driver2"
      driver_class: external_connector
      pins: { step_pin: i2so.5, direction_pin: i2so.4, disable_pin: i2so.7 }
      notes: "External-driver mode for position 2; requires its routing jumpers and excludes Motor2."
    - label: "External Driver Z - EN/STP/DIR"
      generic_name: "Driver3"
      driver_class: external_connector
      pins: { step_pin: i2so.10, direction_pin: i2so.9, disable_pin: i2so.8 }
      notes: "External-driver mode for position 3; requires its routing jumpers and excludes Motor3."
    - label: "External Driver A - EN/STP/DIR"
      generic_name: "Driver4"
      driver_class: external_connector
      pins: { step_pin: i2so.13, direction_pin: i2so.12, disable_pin: i2so.15 }
      notes: "External-driver mode for position 4; requires its routing jumpers and excludes Motor4."
    - label: "External Driver B - EN/STP/DIR"
      generic_name: "Driver5"
      driver_class: external_connector
      pins: { step_pin: i2so.18, direction_pin: i2so.17, disable_pin: i2so.16 }
      notes: "External-driver mode for position 5; requires its routing jumpers and excludes Motor5."
    - label: "External Driver C - EN/STP/DIR"
      generic_name: "Driver6"
      driver_class: external_connector
      pins: { step_pin: i2so.21, direction_pin: i2so.20, disable_pin: i2so.23 }
      notes: "External-driver mode for position 6; requires its routing jumpers and excludes Motor6."

generic_pins:
  # GPIO2 and GPIO26 use optocouplers powered from a fixed onboard 5V supply.
  - label: "Input IO2"
    generic_name: "In2"
    mcu_pin: gpio.2
    direction: input
    input_profile: { conditioning: opto_isolated, internal_pullup_required: true }
    notes: "PiBot's pin overview says GPIO2 requires :pu in FluidNC configuration."
  - label: "Input IO26 - GPIO26 Jumper Input"
    generic_name: "In26"
    mcu_pin: gpio.26
    direction: input
    input_profile: { conditioning: opto_isolated, internal_pullup_required: false }
    notes: >
      Fixed-5V opto-isolated input selected by setting the GPIO26 function
      jumper to Input. Shares gpio.26 with Relay26; only one path may be used.

  # Six SW-VCC-selectable opto-isolated inputs.
  - { label: "Input IO33", generic_name: "In33", mcu_pin: gpio.33, direction: input, input_profile: { conditioning: opto_isolated, internal_pullup_required: false, voltage_max: 24.0 }, notes: "SW-VCC-selectable input. For a 24V signal, PiBot requires a series resistor of at least 2.2k ohms on board revisions made before July 2026; later revisions do not require it. Verify the board revision date." }
  - { label: "Input IO32", generic_name: "In32", mcu_pin: gpio.32, direction: input, input_profile: { conditioning: opto_isolated, internal_pullup_required: false, voltage_max: 24.0 }, notes: "SW-VCC-selectable input. For a 24V signal, PiBot requires a series resistor of at least 2.2k ohms on board revisions made before July 2026; later revisions do not require it. Verify the board revision date." }
  - { label: "Input IO35", generic_name: "In35", mcu_pin: gpio.35, direction: input, input_profile: { conditioning: opto_isolated, internal_pullup_required: false, voltage_max: 24.0 }, notes: "SW-VCC-selectable input. For a 24V signal, PiBot requires a series resistor of at least 2.2k ohms on board revisions made before July 2026; later revisions do not require it. Verify the board revision date." }
  - { label: "Input IO34", generic_name: "In34", mcu_pin: gpio.34, direction: input, input_profile: { conditioning: opto_isolated, internal_pullup_required: false, voltage_max: 24.0 }, notes: "SW-VCC-selectable input. For a 24V signal, PiBot requires a series resistor of at least 2.2k ohms on board revisions made before July 2026; later revisions do not require it. Verify the board revision date." }
  - { label: "Input IO39", generic_name: "In39", mcu_pin: gpio.39, direction: input, input_profile: { conditioning: opto_isolated, internal_pullup_required: false, voltage_max: 24.0 }, notes: "SW-VCC-selectable input. For a 24V signal, PiBot requires a series resistor of at least 2.2k ohms on board revisions made before July 2026; later revisions do not require it. Verify the board revision date." }
  - { label: "Input IO36", generic_name: "In36", mcu_pin: gpio.36, direction: input, input_profile: { conditioning: opto_isolated, internal_pullup_required: false, voltage_max: 24.0 }, notes: "SW-VCC-selectable input. For a 24V signal, PiBot requires a series resistor of at least 2.2k ohms on board revisions made before July 2026; later revisions do not require it. Verify the board revision date." }

  # Two buffered 5V logic outputs, each sharing its GPIO with a VMot MOSFET.
  - { label: "5V PWM / Switch - GPIO.4", generic_name: "5V Out4", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0 }, notes: "Also activates the VMot MOSFET output FET4; the two physical outputs are not independent." }
  - { label: "5V PWM / Switch - GPIO.12", generic_name: "5V Out12", mcu_pin: gpio.12, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0 }, notes: "Also activates the VMot MOSFET output FET12; the two physical outputs are not independent." }
  - { label: "5V Output - GPIO.13", generic_name: "5V Out13", mcu_pin: gpio.13, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0 }, notes: "Buffered 5V logic output. Shares gpio.13 with the onboard 0-10V spindle output, so the two physical outputs are not independent." }
  - { label: "5V Output - GPIO.14", generic_name: "5V Out14", mcu_pin: gpio.14, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 5.0 }, notes: "Buffered 5V logic output. Shares gpio.14 with Spindle Out14 and the RS485 RTS signal, so those uses are mutually exclusive." }
  - { label: "VMot MOSFET - GPIO.4", generic_name: "FET4", mcu_pin: gpio.4, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 24.0 }, notes: "Low-side VMot-main load output. Shares gpio.4 with 5V Out4." }
  - { label: "VMot MOSFET - GPIO.12", generic_name: "FET12", mcu_pin: gpio.12, direction: output, output_profile: { drive_type: mosfet_low_side, voltage_max: 24.0 }, notes: "Low-side VMot-main load output. Shares gpio.12 with 5V Out12." }

  # VFD / spindle interface.
  - { label: "0-10V - GPIO.13", generic_name: "Spindle 10V", mcu_pin: gpio.13, direction: output, output_profile: { drive_type: totem_pole, voltage_max: 10.0 }, notes: "PWM followed by the onboard 0-10V conversion circuit; maximum voltage is adjustable by the onboard trim potentiometer." }
  - { label: "OPT IO14 / COMMON", generic_name: "Spindle Out14", mcu_pin: gpio.14, direction: output, output_profile: { drive_type: open_collector }, notes: "Optocoupler switch output. Shares gpio.14 with the RS485 RTS signal." }
  - { label: "OPT IO15 / COMMON", generic_name: "Spindle Out15", mcu_pin: gpio.15, direction: output, output_profile: { drive_type: open_collector }, notes: "Optocoupler switch output. Shares gpio.15 with the RS485 TX signal." }

  # GPIO26 alternate path: transistor-driven onboard isolated relay.
  - label: "Onboard Relay - GPIO26 Jumper Relay Output"
    generic_name: "Relay26"
    mcu_pin: gpio.26
    direction: output
    output_profile: { drive_type: relay }
    notes: >
      Onboard NO/COM/NC relay contacts controlled by gpio.26 when the GPIO26
      function jumper is set to Relay Output. May be assigned as an
      independent Relay spindle output, another spindle's enable pin,
      coolant, status, or a digital user output. Shares gpio.26 with In26;
      only one path may be used.

  # GPIO25/GPIO27 module header: raw GPIO, OLED I2C, and pendant/expander
  # UART are alternate uses of the same two pins.
  - { label: "Module Header GPIO.25", generic_name: "IO25", mcu_pin: gpio.25, direction: either, input_profile: { conditioning: raw }, output_profile: { drive_type: totem_pole, voltage_max: 3.3 }, notes: "Raw 3.3V GPIO sharing the OLED and Pendant/Expander connector functions." }
  - { label: "Module Header GPIO.27", generic_name: "IO27", mcu_pin: gpio.27, direction: either, input_profile: { conditioning: raw }, output_profile: { drive_type: totem_pole, voltage_max: 3.3 }, notes: "Raw 3.3V GPIO sharing the OLED and Pendant/Expander connector functions." }

rs485_channels:
  - label: "RS485"
    generic_name: "RS485"
    tx_pin: gpio.15
    rx_pin: gpio.16
    rts_pin: gpio.14
    pins_reusable_as_generic_io: true
    notes: >
      PiBot's YL620 example uses uart1 TX gpio.15, RX gpio.16 and RTS gpio.14.
      GPIO14/GPIO15 are also exposed as the optocoupler switch outputs
      Spindle Out14 and Spindle Out15, so those uses are mutually exclusive.

expansion_uarts:
  - label: "Pendant / I/O Expander"
    generic_name: "Pendant"
    connector_type: "PiBot module connector"
    txd_pin: gpio.27
    rxd_pin: gpio.25
    baud: 1000000
    mode: "8N1"
    notes: >
      PiBot's V4.96 pendant documentation uses TX gpio.27 and RX gpio.25.
      Shares both pins with the OLED I2C header and raw IO25/IO27 resources,
      so only one of those connector modes may be used.

i2c_connectors:
  - label: "OLED"
    generic_name: "OLED"
    sda_pin: gpio.27
    scl_pin: gpio.25
    notes: >
      Four-pin 3.3V OLED header. PiBot's factory example uses i2c0 with
      GPIO27 SDA, GPIO25 SCL and a 128x64 display at address 0x3C. Shares
      both pins with the Pendant/Expander UART and raw IO25/IO27 resources.
